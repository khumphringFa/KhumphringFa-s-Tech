name: Build USB Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/UsbGuard/UsbGuard.csproj
      - name: Compile
        run: dotnet build src/UsbGuard/UsbGuard.csproj --configuration Release --no-restore
      - name: Publish self-contained executable
        run: dotnet publish src/UsbGuard/UsbGuard.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhumphringFa-USB-Guard-win-x64
          path: publish/
          if-no-files-found: error
